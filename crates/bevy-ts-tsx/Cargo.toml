[package]
name = "bevy-ts-tsx"
description = "TSX scenes for bevy-ts: the Rust-side reconciler"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bevy_ts_tsx"

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_ui", "bevy_ui_widgets", "bevy_picking"] }
bevy-ts = { workspace = true, features = ["pbr"] }
bevy-ts-remote.workspace = true
bevy-ts-material.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Tests link Bevy as one dylib; release and project-engine builds never see dev-dependencies
# (docs/build-cache.md, Bevy as a dylib for tests).
bevy = { workspace = true, features = ["dynamic_linking", "bevy_scene", "bevy_world_serialization"] }
