[package]
name = "bevy-ts-tsx"
description = "TSX scenes for bevy-ts: the Rust-side reconciler"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bevy_ts_tsx"

[dependencies]
# Not Bevy's four PBR texture features: with them the StandardMaterial pipeline binds 18
# textures per fragment stage, past wgpu's default 16 (bench/standard-material-features).
bevy = { workspace = true, features = ["std", "bevy_ui", "bevy_ui_widgets", "bevy_picking", "bevy_input_focus", "bevy_clipboard"] }
bevy-ts = { workspace = true, features = ["pbr"] }
bevy-ts-remote.workspace = true
bevy-ts-material.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
bevy = { workspace = true, features = ["bevy_scene", "bevy_world_serialization", "png"] }

# Tests link Bevy as one dylib, except a release bench (`cargo static test --release` sets bevy_ts_static):
# a release build links Bevy statically, as what ships does (docs/build-cache.md, Bevy as a dylib).
[target.'cfg(not(bevy_ts_static))'.dev-dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }

[lints]
workspace = true
