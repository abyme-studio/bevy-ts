[package]
name = "bevy-ts-animation"
description = "Scene animation for bevy-ts: PlayAnimation plays a glTF clip on a scene's animation players, wired in Rust the way Bevy's examples do"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bevy_ts_animation"

[dependencies]
bevy = { workspace = true, features = ["3d"] }
bevy-ts-native.workspace = true

[dev-dependencies]
bevy = { workspace = true, features = ["3d"] }

# Tests link Bevy as one dylib, except a release bench (`cargo static test --release` sets bevy_ts_static):
# a release build links Bevy statically, as what ships does (docs/build-cache.md, Bevy as a dylib).
[target.'cfg(not(bevy_ts_static))'.dev-dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }

[lints]
workspace = true
