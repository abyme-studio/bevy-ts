[package]
name = "bevy-ts-animation"
description = "Scene animation for bevy-ts: PlayAnimation plays a glTF clip on a scene's animation players, wired in Rust the way Bevy's examples do"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bevy_ts_animation"

[dependencies]
bevy = { workspace = true, features = ["3d"] }

[dev-dependencies]
# Tests link Bevy as one dylib; release and project-engine builds never see dev-dependencies
# (docs/build-cache.md, Bevy as a dylib for tests).
bevy = { workspace = true, features = ["dynamic_linking", "3d"] }
