[package]
name = "bevy-ts-remote"
description = "The bevy-ts Remote Protocol, served next to stock bevy_remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bevy_ts_remote"

[dependencies]
bevy = { workspace = true, features = ["bevy_remote", "bevy_render", "bevy_camera", "bevy_core_pipeline", "bevy_sprite", "bevy_world_serialization", "png"] }
bevy-ts = { workspace = true, features = ["reflect"] }
async-channel = "2"
serde.workspace = true
serde_json.workspace = true

# Tests link Bevy as one dylib, except a release bench (`cargo static test --release` sets bevy_ts_static):
# a release build links Bevy statically, as what ships does (docs/build-cache.md, Bevy as a dylib).
[target.'cfg(not(bevy_ts_static))'.dev-dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }
