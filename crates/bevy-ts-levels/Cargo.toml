[package]
name = "bevy-ts-levels"
description = "Levels for bevy-ts: .bsn files loaded as reconciled roots, and the writer the viewport edits them through"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bevy_ts_levels"

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_asset", "bevy_remote"] }
bevy-ts-remote.workspace = true
bevy-ts.workspace = true
bevy-ts-tsx.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The vendored `bevy_bsn` (src/upstream) needs these, for the differential test only.
nom = "8"
memchr = "2"
thiserror = { version = "2", default-features = false }

# Tests link Bevy as one dylib, except a release bench (`cargo static test --release` sets bevy_ts_static):
# a release build links Bevy statically, as what ships does (docs/build-cache.md, Bevy as a dylib).
[target.'cfg(not(bevy_ts_static))'.dev-dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }

[lints]
workspace = true
