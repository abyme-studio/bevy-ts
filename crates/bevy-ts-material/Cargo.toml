[package]
name = "bevy-ts-material"
description = "Script materials for bevy-ts: WGSL files and a parameter schema declared in TS, drawn by one erased Rust material"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bevy_ts_material"

[dependencies]
# Bevy's renderer and 3D, not its platform half (winit, gilrs, clipboard): the embedding links this
# on Android, where the host owns the window. `bevy_text` for world text's layout. `bevy_sprite` for
# the pixel-2D components' `Sprite`, which bevy-ts-tsx builds already. `bevy_sprite_render` for
# script 2D materials (`material2d.rs`), which the engine builds already.
bevy = { workspace = true, features = ["3d_bevy_render", "bevy_text", "bevy_sprite", "bevy_sprite_render"] }
# `reflect` for owned materials (`owned.rs`: reflect_asset, ts_hand_map).
bevy-ts = { workspace = true, features = ["reflect"] }
serde.workspace = true
serde_json.workspace = true
# The WGSL check before a shader is replaced (operator-approved 2026-10-21): the versions Bevy
# 0.20 and wgpu 30 already build, with their features.
wesl = { version = "0.6", features = ["naga-ext"] }
naga = { version = "30", features = ["wgsl-in"] }

[dev-dependencies]
# `bevy_sprite_render` draws the pixel-2D render tests' sprites, as the engine does.
bevy = { workspace = true, features = ["3d", "bevy_sprite_render"] }

# Tests link Bevy as one dylib, except a release bench (`cargo static test --release` sets bevy_ts_static):
# a release build links Bevy statically, as what ships does (docs/build-cache.md, Bevy as a dylib).
[target.'cfg(not(bevy_ts_static))'.dev-dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }

[lints]
workspace = true
