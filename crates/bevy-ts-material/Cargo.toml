[package]
name = "bevy-ts-material"
description = "Script materials for bevy-ts: WGSL files and a parameter schema declared in TS, drawn by one erased Rust material"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bevy_ts_material"

[dependencies]
bevy = { workspace = true, features = ["3d"] }
bevy-ts.workspace = true
serde.workspace = true
serde_json.workspace = true
# The WGSL check before a shader is replaced (operator-approved 2026-10-21): the versions Bevy
# 0.20 and wgpu 30 already build, with their features.
wesl = { version = "0.6", features = ["naga-ext"] }
naga = { version = "30", features = ["wgsl-in"] }

[dev-dependencies]
# Tests link Bevy as one dylib; release and project-engine builds never see dev-dependencies
# (docs/build-cache.md, Bevy as a dylib for tests).
bevy = { workspace = true, features = ["dynamic_linking", "3d"] }
