[package]
name = "bevy-ts-native"
description = "A bevy-ts project's native crate API: the native! entry, NativeApp, exposed sets and native functions"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bevy_ts_native"

[dependencies]
bevy = { workspace = true }
bevy-ts.workspace = true
bevy-ts-native-derive.workspace = true

[dev-dependencies]
# Tests link Bevy as one dylib; release and project-engine builds never see dev-dependencies
# (docs/build-cache.md, Bevy as a dylib for tests).
bevy = { workspace = true, features = ["dynamic_linking"] }
