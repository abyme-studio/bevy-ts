[package]
name = "bevy-ts-native"
description = "A bevy-ts project's native crate API: the native! entry, NativeApp, exposed sets and native functions"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bevy_ts_native"

[features]
default = ["gizmos"]
# Bevy's `Gizmos` for TS: `TsGizmos`, its method table and `ts_gizmo_group`.
gizmos = ["bevy/bevy_gizmos", "bevy/bevy_curve", "bevy/bevy_light", "bevy-ts/reflect", "dep:serde_json"]

[dependencies]
bevy = { workspace = true }
bevy-ts.workspace = true
bevy-ts-native-derive.workspace = true
serde_json = { workspace = true, optional = true }

# Tests link Bevy as one dylib, except a release bench (`cargo static test --release` sets bevy_ts_static):
# a release build links Bevy statically, as what ships does (docs/build-cache.md, Bevy as a dylib).
[target.'cfg(not(bevy_ts_static))'.dev-dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }

[lints]
workspace = true
