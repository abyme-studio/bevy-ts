[package]
name = "bevy-ts-cli"
description = "The bevy-ts engine binary: bevy-ts dev <entry.ts>"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bevy-ts"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = ["3d", "bevy_remote", "file_watcher"] }
bevy-ts = { workspace = true, features = ["pbr"] }
bevy-ts-v8.workspace = true
bevy-ts-remote.workspace = true
bevy-ts-tsx.workspace = true
bevy-ts-viewport.workspace = true
bevy-ts-levels.workspace = true
oxc = { version = "0.154", features = ["transformer", "codegen", "semantic", "ast_visit"] }
notify = "8"
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"
toml = "1"

[lib]
name = "bevy_ts_cli"
path = "src/lib.rs"

[dev-dependencies]
bevy = { workspace = true }
bevy-ts-native.workspace = true
jsonschema = { version = "0.33", default-features = false }
tungstenite = "0.28"
