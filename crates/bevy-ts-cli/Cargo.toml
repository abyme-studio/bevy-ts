[package]
name = "bevy-ts-cli"
description = "The bevy-ts engine binary: bevy-ts dev <entry.ts>"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bevy-ts"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = ["3d", "bevy_ui_render", "bevy_remote", "file_watcher"] }
bevy-ts = { workspace = true, features = ["pbr"] }
bevy-ts-v8.workspace = true
bevy-ts-remote.workspace = true
bevy-ts-tsx.workspace = true
bevy-ts-viewport.workspace = true
bevy-ts-levels.workspace = true
bevy-ts-material.workspace = true
bevy-ts-animation.workspace = true
bevy-ts-native.workspace = true
oxc = { version = "0.154", features = ["transformer", "codegen", "semantic", "ast_visit"] }
oxc_resolver = "11.24"
notify = "8"
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"
toml = "1"

[lib]
name = "bevy_ts_cli"
path = "src/lib.rs"

[dev-dependencies]
# Tests link Bevy as one dylib; release and project-engine builds never see dev-dependencies
# (docs/build-cache.md, Bevy as a dylib for tests).
bevy = { workspace = true, features = ["dynamic_linking"] }
jsonschema = { version = "0.33", default-features = false }
tungstenite = "0.28"
