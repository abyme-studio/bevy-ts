[package]
name = "bevy-ts-cli"
description = "The bevy-ts engine binary: bevy-ts dev <entry.ts>"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bevy-ts"
path = "src/main.rs"

[features]
default = ["pcss"]
# Bevy's percentage-closer soft shadows: `soft_shadow_size` on lights. On in the prebuilt engine: it
# costs nothing measurable with soft shadows unset (tests/it/pcss_bench.rs; the bench's other arm is
# `--no-default-features`). Keep it on in every supported build: `bevy-ts/bevy` ships PointLight and
# SpotLight with `soft_shadows_enabled`, so an engine without pcss refuses their shipped layout.
pcss = ["bevy/experimental_pbr_pcss"]

[dependencies]
bevy = { workspace = true, features = ["3d", "bevy_ui_render", "bevy_remote", "file_watcher", "system_font_discovery"] }
bevy-ts = { workspace = true, features = ["pbr"] }
bevy-ts-v8.workspace = true
bevy-ts-remote.workspace = true
bevy-ts-tsx.workspace = true
bevy-ts-viewport.workspace = true
bevy-ts-levels.workspace = true
bevy-ts-material.workspace = true
bevy-ts-animation.workspace = true
bevy-ts-native.workspace = true
oxc = { version = "0.154", features = ["transformer", "codegen", "semantic", "ast_visit"] }
oxc_resolver = "11.24"
notify = "8"
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"
toml = "1"

[lib]
name = "bevy_ts_cli"
path = "src/lib.rs"

[dev-dependencies]
bevy = { workspace = true }
parley = { version = "0.11", default-features = false, features = ["std"] }
jsonschema = { version = "0.33", default-features = false }
# Test textures, written as PNG; already in the tree through Bevy's image loader.
png = "0.18"
tungstenite = "0.28"

# sha2 0.10 hashes with the CPU's SHA instructions on aarch64 only with `asm`: an engine's checksum
# takes seconds, not tens of seconds (docs/research/engine-cache-link.md).
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

# Tests link Bevy as one dylib, except a release bench (`cargo static test --release` sets bevy_ts_static):
# a release build links Bevy statically, as what ships does (docs/build-cache.md, Bevy as a dylib).
[target.'cfg(not(bevy_ts_static))'.dev-dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }

[lints]
workspace = true
