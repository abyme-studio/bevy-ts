[package]
name = "bevy-ts-embed"
description = "bevy-ts as a library a host drives: the shipped game's app, its input mapping, and the embedding API"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bevy_ts_embed"

# The shipped game's Bevy without its platform half (no winit, gilrs, audio, remote or file
# watcher): what an embedding host links. The CLI adds the platform for its own window.
[dependencies]
bevy = { workspace = true, features = [
  "default_app", "3d_bevy_render", "scene", "picking", "bevy_ui_render", "bevy_window",
  "std", "multi_threaded", "default_font", "png", "system_font_discovery", "sysinfo_plugin",
] }
bevy-ts = { workspace = true, features = ["pbr"] }
bevy-ts-v8.workspace = true
bevy-ts-remote.workspace = true
bevy-ts-tsx.workspace = true
bevy-ts-levels.workspace = true
bevy-ts-material.workspace = true
bevy-ts-animation.workspace = true
bevy-ts-native.workspace = true
serde.workspace = true
serde_json.workspace = true
raw-window-handle = "0.6"

# Off Android, something in a build always turns on Bevy's winit (the CLI, the viewport, a dev
# dependency), so the embedding names it to leave `WinitPlugin` out: the host owns the window. On
# Android nothing links winit.
[target.'cfg(not(target_os = "android"))'.dependencies]
bevy = { workspace = true, features = ["bevy_winit"] }

# Bevy's own wgpu, to read the GPU before Bevy makes its device (src/gpu.rs).
[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "30", default-features = false }

# Tests link Bevy as one dylib, except a release bench (`cargo static test --release` sets bevy_ts_static):
# a release build links Bevy statically, as what ships does (docs/build-cache.md, Bevy as a dylib).
[target.'cfg(not(bevy_ts_static))'.dev-dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }

[lints]
workspace = true
