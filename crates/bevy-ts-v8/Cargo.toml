[package]
name = "bevy-ts-v8"
description = "The V8 (deno_core) backend for bevy-ts"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bevy_ts_v8"

[features]
# Must stay off: column views wrap memory outside any V8 sandbox. Enabling it fails the build
# (see src/lib.rs and openspec/changes/bridge/design.md, "Data layout across the boundary").
v8_enable_sandbox = []

[dependencies]
bevy-ts.workspace = true
deno_core.workspace = true
deno_error = "0.7"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tungstenite = "0.28"

[dev-dependencies]
bevy = { workspace = true }

# Tests link Bevy as one dylib, except a release bench (`cargo static test --release` sets bevy_ts_static):
# a release build links Bevy statically, as what ships does (docs/build-cache.md, Bevy as a dylib).
[target.'cfg(not(bevy_ts_static))'.dev-dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }

[lints]
workspace = true
