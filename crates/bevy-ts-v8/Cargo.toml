[package]
name = "bevy-ts-v8"
description = "The V8 (deno_core) backend for bevy-ts"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bevy_ts_v8"

[features]
# Must stay off: column views wrap memory outside any V8 sandbox. Enabling it fails the build
# (see src/lib.rs and openspec/changes/bridge/design.md, "Data layout across the boundary").
v8_enable_sandbox = []

[dependencies]
bevy-ts.workspace = true
deno_core.workspace = true
deno_error = "0.7"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tungstenite = "0.28"

[dev-dependencies]
# Tests link Bevy as one dylib; release and project-engine builds never see dev-dependencies
# (docs/build-cache.md, Bevy as a dylib for tests).
bevy = { workspace = true, features = ["dynamic_linking"] }
