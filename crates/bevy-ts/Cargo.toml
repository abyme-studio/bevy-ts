[package]
name = "bevy-ts"
description = "TypeScript components and systems for Bevy: the engine-neutral bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bevy_ts"

[features]
default = ["pbr"]
# Native spawn recipes that need rendering (camera3d, directionalLight, cuboid).
pbr = ["bevy/3d_api", "bevy/bevy_pbr", "bevy/bevy_core_pipeline"]
track_location = ["bevy/track_location"]

[dependencies]
# The real `WebSocket` transport: async-io on `IoTaskPool`. 0.33 shares the locked tungstenite 0.28.
async-channel = "2"
async-io = "2"
async-tungstenite = { version = "0.33", default-features = false, features = ["handshake"] }
blocking = "1"
bevy = { workspace = true, features = ["std", "multi_threaded", "bevy_log", "async_executor", "bevy_state"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Tests link Bevy as one dylib; release and project-engine builds never see dev-dependencies
# (docs/build-cache.md, Bevy as a dylib for tests).
bevy = { workspace = true, features = ["dynamic_linking", "bevy_ui"] }
tungstenite = "0.28"
