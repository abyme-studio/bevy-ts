name: release
# Builds the engine on each platform's native runner, publishes the platform packages, then bevy-ts
# listing in optionalDependencies only the platforms that are on npm at this version.
#
# Release: push a tag `v<version>` (git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1).
# A pre-release version goes out under dist-tag `next`, a stable one under `latest`.
# Dry run: Actions > release > Run workflow; nothing reaches npm unless `publish` is ticked.
#
# Auth: npm trusted publishing (OIDC). Each package has abyme-studio/bevy-ts, release.yml as its
# trusted publisher; there is no npm token. A package that does not exist on npm yet cannot have a
# trusted publisher, so its publish fails here and it is left out of bevy-ts (docs/release.md).
# Re-running is safe: a package already on npm at this version is skipped, not republished.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for every package (e.g. 0.1.0-alpha.1)
        required: true
      tag:
        description: npm dist-tag
        default: next
      publish:
        description: Publish to npm (unticked is a dry run)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: engine ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    env:
      # Oldest macOS Apple still patches (14 Sonoma, beside 15 and 26). Without it the C deps build
      # for the runner's SDK (blake3_neon came out at 26.5) and the binary claims 11.0 it cannot run.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: win32-x64, runner: windows-2025 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies (Bevy)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config
      - name: Build the release engine
        run: cargo build --release -p bevy-ts-cli
      - name: Stage the binary
        shell: bash
        run: |
          exe=bevy-ts; [[ "${{ matrix.platform }}" == win32-* ]] && exe=bevy-ts.exe
          mkdir -p out && cp "target/release/$exe" out/
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}
          path: out/
          retention-days: 7

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing and dist-tag over OIDC (>= 11.21)
        run: npm install -g npm@^11.21.0 && npm --version
      - name: Version, dist-tag and whether to publish
        id: release
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
            publish=true
          else
            version="${{ inputs.version }}"; tag="${{ inputs.tag }}"; publish="${{ inputs.publish }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "bevy-ts $version under $tag, publish=$publish"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Which platforms built
        id: built
        run: |
          list=$(ls artifacts | sed -n 's/^engine-//p' | paste -sd, -)
          [ -n "$list" ] || { echo "no engine built" >&2; exit 1; }
          echo "platforms=$list" >> "$GITHUB_OUTPUT"
          echo "Built: $list"
      - name: Publish the platform packages
        id: platforms
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          node scripts/set-npm-version.mjs "$VERSION" "${{ steps.built.outputs.platforms }}"
          flags="--provenance --access public --tag $TAG"
          [ "$PUBLISH" = true ] || flags="$flags --dry-run"
          ok=()
          for p in $(echo "${{ steps.built.outputs.platforms }}" | tr , ' '); do
            if [ -n "$(npm view "@bevy-ts/$p@$VERSION" version 2>/dev/null)" ]; then
              echo "@bevy-ts/$p@$VERSION is already on npm; skipped"; ok+=("$p"); continue
            fi
            mkdir -p packages/platforms/$p/bin
            install -m 755 artifacts/engine-$p/* packages/platforms/$p/bin/
            if (cd packages/platforms/$p && npm publish $flags); then
              ok+=("$p")
            else
              echo "::warning::@bevy-ts/$p@$VERSION did not publish (no trusted publisher yet?); left out of bevy-ts"
            fi
          done
          [ ${#ok[@]} -gt 0 ] || { echo "no platform package published" >&2; exit 1; }
          echo "published=$(IFS=,; echo "${ok[*]}")" >> "$GITHUB_OUTPUT"
      - name: Publish bevy-ts
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          if [ -n "$(npm view "bevy-ts@$VERSION" version 2>/dev/null)" ]; then
            echo "bevy-ts@$VERSION is already on npm; skipped"; exit 0
          fi
          node scripts/set-npm-version.mjs "$VERSION" "${{ steps.platforms.outputs.published }}"
          flags="--provenance --access public --tag $TAG"
          [ "$PUBLISH" = true ] || flags="$flags --dry-run"
          cd packages/bevy-ts && npm publish $flags
      # Until bevy-ts has a stable version, `latest` follows the newest pre-release too, so a plain
      # `npm i bevy-ts` gets it. Needs "Allow npm dist-tag" on each package's trusted publisher.
      - name: latest follows pre-releases until a stable release
        if: ${{ steps.release.outputs.publish == 'true' && steps.release.outputs.tag == 'next' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for pkg in bevy-ts $(echo "${{ steps.platforms.outputs.published }}" | tr , ' ' | sed 's|^|@bevy-ts/|; s| | @bevy-ts/|g'); do
            stable=$(npm view "$pkg" versions --json | node -e 'const v=[].concat(JSON.parse(require("fs").readFileSync(0,"utf8")));console.log(v.some(x=>!x.includes("-")))')
            [ "$stable" = false ] || { echo "$pkg has a stable version; latest left alone"; continue; }
            npm dist-tag add "$pkg@$VERSION" latest || echo "::warning::could not move $pkg latest to $VERSION (Allow npm dist-tag unset?)"
          done
