name: release
# Builds the engine on each platform's native runner (PLATFORMS below), publishes each platform package from a job of
# its own (in parallel, each with a fresh OIDC token), then bevy-ts once every platform's engine
# built and is on npm at this version; a failed build or publish holds bevy-ts back. npm's 5xx and
# transient 404s are retried with backoff (scripts/npm-publish.sh).
#
# Release: push a tag `v<version>` (git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1).
# A pre-release version goes out under dist-tag `next`, a stable one under `latest`.
# Dry run: Actions > release > Run workflow; nothing reaches npm unless `publish` is ticked.
#
# Auth: npm trusted publishing (OIDC). Each package has abyme-studio/bevy-ts, release.yml as its
# trusted publisher; there is no npm token. A package that does not exist on npm yet cannot have a
# trusted publisher, so its publish fails here and bevy-ts is held back (docs/release.md).
# Re-running is safe: a package already on npm at this version is skipped, not republished. After
# a failure, "Re-run failed jobs" finishes the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for every package (e.g. 0.1.0-alpha.1)
        required: true
      tag:
        description: npm dist-tag
        default: next
      publish:
        description: Publish to npm (unticked is a dry run)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  release:
    name: version, dist-tag and platforms
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      matrix: ${{ steps.platforms.outputs.matrix }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      # The platforms released, one line each: `<platform> <runner>`. Only darwin-arm64 ships for
      # now; uncomment a line to release that platform again (docs/release.md).
      - name: Platforms
        id: platforms
        env:
          PLATFORMS: |
            darwin-arm64 macos-15
            # darwin-x64 macos-15-intel
            # linux-x64 ubuntu-24.04
            # linux-arm64 ubuntu-24.04-arm
            # win32-x64 windows-2025
        run: |
          rows=$(printf '%s\n' "$PLATFORMS" | sed -e 's/#.*//' | awk 'NF')
          echo "matrix=$(printf '%s\n' "$rows" | jq -Rnc '[inputs | split(" ") | {platform: .[0], runner: .[1]}]')" >> "$GITHUB_OUTPUT"
          echo "platforms=$(printf '%s\n' "$rows" | awk '{print $1}' | paste -sd, -)" >> "$GITHUB_OUTPUT"
          echo "Platforms: $(printf '%s\n' "$rows" | awk '{print $1}' | paste -sd' ' -)"
      - name: Version, dist-tag and whether to publish
        id: release
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
          IN_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
            publish=true
          else
            version="$IN_VERSION"; tag="$IN_TAG"; publish="$IN_PUBLISH"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "bevy-ts $version under $tag, publish=$publish"

  build:
    name: engine ${{ matrix.platform }}
    needs: release
    runs-on: ${{ matrix.runner }}
    env:
      # Oldest macOS Apple still patches (14 Sonoma, beside 15 and 26). Without it the C deps build
      # for the runner's SDK (blake3_neon came out at 26.5) and the binary claims 11.0 it cannot run.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies (Bevy)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config
      - name: Build the release engine
        run: cargo build --release -p bevy-ts-cli
      - name: Stage the binary
        shell: bash
        run: |
          exe=bevy-ts; [[ "${{ matrix.platform }}" == win32-* ]] && exe=bevy-ts.exe
          mkdir -p out && cp "target/release/$exe" out/
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}
          path: out/
          retention-days: 7

  # One job per platform: a slow or failing publish holds up no other, and each mints its own OIDC
  # token. A platform whose engine did not build has no artifact and publishes nothing, and bevy-ts
  # is then held back until "Re-run failed jobs" builds it.
  platform:
    name: publish ${{ matrix.platform }}
    needs: [release, build]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.matrix) }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
      PUBLISH: ${{ needs.release.outputs.publish }}
      P: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing over OIDC (>= 11.21)
        run: npm install -g npm@^11.21.0 && npm --version
      - uses: actions/download-artifact@v4
        id: engine
        continue-on-error: true
        with:
          name: engine-${{ matrix.platform }}
          path: engine
      - name: Publish @bevy-ts/${{ matrix.platform }}
        if: ${{ steps.engine.outcome == 'success' }}
        run: |
          node scripts/set-npm-version.mjs "$VERSION" "$P"
          mkdir -p "packages/platforms/$P/bin"
          install -m 755 engine/* "packages/platforms/$P/bin/"
          flags=(--provenance --access public --tag "$TAG")
          [ "$PUBLISH" = true ] || flags+=(--dry-run)
          scripts/npm-publish.sh "packages/platforms/$P" "@bevy-ts/$P" "$VERSION" "${flags[@]}"
      - name: No engine built
        if: ${{ steps.engine.outcome != 'success' }}
        run: echo "::warning::engine $P did not build; nothing to publish"

  bevy-ts:
    name: publish bevy-ts
    needs: [release, platform]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
      PUBLISH: ${{ needs.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing and dist-tag over OIDC (>= 11.21)
        run: npm install -g npm@^11.21.0 && npm --version
      - name: Which platforms built
        id: built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          list=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            --jq '.artifacts[].name' | sed -n 's/^engine-//p' | sort -u | paste -sd, -)
          [ -n "$list" ] || { echo "no engine built" >&2; exit 1; }
          echo "platforms=$list" >> "$GITHUB_OUTPUT"
          echo "Built: $list"
      # bevy-ts never goes out missing an engine: every platform must have built and be on npm at
      # this version first, or bevy-ts waits for a rerun. A dry run takes whatever built.
      - name: Every platform built and is on npm
        if: ${{ needs.release.outputs.publish == 'true' }}
        run: scripts/npm-await.sh "$VERSION" "${{ needs.release.outputs.platforms }}" "${{ steps.built.outputs.platforms }}"
      - name: Publish bevy-ts
        run: |
          node scripts/set-npm-version.mjs "$VERSION" "${{ steps.built.outputs.platforms }}"
          flags=(--provenance --access public --tag "$TAG")
          [ "$PUBLISH" = true ] || flags+=(--dry-run)
          scripts/npm-publish.sh packages/bevy-ts bevy-ts "$VERSION" "${flags[@]}"
      # Until bevy-ts has a stable version, `latest` follows the newest pre-release too, so a plain
      # `npm i bevy-ts` gets it. Needs "Allow npm dist-tag" on bevy-ts's trusted publisher. The
      # platform packages are pinned by exact version, so their `latest` does not matter.
      - name: latest follows pre-releases until a stable release
        if: ${{ needs.release.outputs.publish == 'true' && needs.release.outputs.tag == 'next' }}
        run: |
          stable=$(npm view bevy-ts versions --json | node -e 'const v=[].concat(JSON.parse(require("fs").readFileSync(0,"utf8")));console.log(v.some(x=>!x.includes("-")))')
          if [ "$stable" = false ]; then
            npm dist-tag add "bevy-ts@$VERSION" latest || echo "::warning::could not move bevy-ts latest to $VERSION (Allow npm dist-tag unset?)"
          fi
