name: ci
on: [push, pull_request]
jobs:
  protocol:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Protocol types match protocol/bevy-ts.openrpc.json
        run: scripts/gen-protocol.sh --check
      - name: TS types
        run: cd packages/bevy-ts && pnpm check
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      # Workspace-wide, so feature unification (serde_json preserve_order via deno_core) is the one CI sees.
      - name: Rust tests
        run: cargo test --workspace
      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
