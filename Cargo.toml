[workspace]
resolver = "3"
members = ["crates/bevy-ts", "crates/bevy-ts-v8", "crates/bevy-ts-remote", "crates/bevy-ts-cli", "crates/bevy-ts-protocol-gen", "crates/bevy-ts-tsx", "crates/bevy-ts-native", "crates/bevy-ts-native-derive", "crates/bevy-ts-viewport", "crates/bevy-ts-levels", "crates/bevy-ts-material", "crates/bevy-ts-animation"]
exclude = ["bench", "crates/bevy-ts-rapier3d", "vendor/bevy_render"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rjmathieson/bevy-ts"

[workspace.dependencies]
bevy = { version = "0.20", default-features = false }
deno_core = "0.412"
# Bevy's, named only to implement its `ScheduleBuildPass` (bevy-ts-tsx).
indexmap = { version = "2.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
bevy-ts = { path = "crates/bevy-ts", default-features = false }
bevy-ts-v8 = { path = "crates/bevy-ts-v8" }
bevy-ts-remote = { path = "crates/bevy-ts-remote" }
bevy-ts-tsx = { path = "crates/bevy-ts-tsx" }
bevy-ts-native = { path = "crates/bevy-ts-native" }
bevy-ts-native-derive = { path = "crates/bevy-ts-native-derive" }
bevy-ts-cli = { path = "crates/bevy-ts-cli" }
bevy-ts-viewport = { path = "crates/bevy-ts-viewport" }
bevy-ts-levels = { path = "crates/bevy-ts-levels" }
bevy-ts-material = { path = "crates/bevy-ts-material" }
bevy-ts-animation = { path = "crates/bevy-ts-animation" }

# `bevy_ts_static`: set by `cargo static test --release` (.cargo/config.toml), so release benches link Bevy
# statically; each crate's tests/it/main.rs refuses a release build without it.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bevy_ts_static)"] }

# Compiles render pipelines off the render thread on macOS (vendor/bevy_render/PATCH.md).
[patch.crates-io]
bevy_render = { path = "vendor/bevy_render" }

# Line tables only: backtraces keep file and line, without the full debug info that made most of
# target/ (docs/build-cache.md). Dependencies carry none. The test profile inherits these.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"
# A dev binary that links the Bevy dylib (tests build it) finds it next to itself, outside cargo too.
rpath = true

[profile.dev.package."*"]
opt-level = 3
debug = false
