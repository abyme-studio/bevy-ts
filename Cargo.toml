[workspace]
resolver = "3"
members = ["crates/bevy-ts", "crates/bevy-ts-v8", "crates/bevy-ts-remote", "crates/bevy-ts-cli", "crates/bevy-ts-protocol-gen", "crates/bevy-ts-tsx", "crates/bevy-ts-native", "crates/bevy-ts-native-derive", "crates/bevy-ts-viewport", "crates/bevy-ts-levels"]
exclude = ["bench", "crates/bevy-ts-rapier3d"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rjmathieson/bevy-ts"

[workspace.dependencies]
bevy = { version = "0.20", default-features = false }
deno_core = "0.412"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
bevy-ts = { path = "crates/bevy-ts", default-features = false }
bevy-ts-v8 = { path = "crates/bevy-ts-v8" }
bevy-ts-remote = { path = "crates/bevy-ts-remote" }
bevy-ts-tsx = { path = "crates/bevy-ts-tsx" }
bevy-ts-native = { path = "crates/bevy-ts-native" }
bevy-ts-native-derive = { path = "crates/bevy-ts-native-derive" }
bevy-ts-cli = { path = "crates/bevy-ts-cli" }
bevy-ts-viewport = { path = "crates/bevy-ts-viewport" }
bevy-ts-levels = { path = "crates/bevy-ts-levels" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
