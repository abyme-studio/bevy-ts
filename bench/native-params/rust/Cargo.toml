[package]
name = "native-params-bench"
version = "0.0.0"
edition = "2024"
publish = false

# The Rust half of one exported-param host call on Bevy 0.20: today's read-only fetch against
# the one a writing param needs. The JS crossing is the same op for both; it is measured by
# crates/bevy-ts-cli/tests/it/native_params_bench.rs.

[dependencies]
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "call"
harness = false

[profile.bench]
debug = false
lto = "thin"
codegen-units = 1
