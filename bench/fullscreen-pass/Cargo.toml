[package]
name = "fullscreen-pass-bench"
version = "0.0.0"
edition = "2024"
publish = false

# One script pass over a 1920×1080 2D scene (openspec change `script-fullscreen-pass`, design 8):
# no pass, a passthrough and a grade, timed apart. Out of the workspace, so the gate never builds it
# (docs/testing.md, rule 8).
[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["2d", "bevy_render", "bevy_core_pipeline", "bevy_sprite_render"] }
bevy-ts = { path = "../../crates/bevy-ts", features = ["reflect"] }
bevy-ts-material = { path = "../../crates/bevy-ts-material" }
serde_json = "1"

# As the engine builds Bevy (the workspace's patch).
[patch.crates-io]
bevy_render = { path = "../../vendor/bevy_render" }

[profile.release]
debug = false
