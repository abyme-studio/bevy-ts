[package]
name = "material2d-bench"
version = "0.0.0"
edition = "2024"
publish = false

# Script 2D materials at 1920×1080 (openspec change `script-material2d`, design 8): planets of three
# layers under `PixelCamera` zoom 3, from one to 500, against no planets. Out of the workspace, so
# the gate never builds it (docs/testing.md, rule 8).
[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["2d", "bevy_render", "bevy_core_pipeline", "bevy_sprite_render"] }
bevy-ts = { path = "../../crates/bevy-ts", features = ["reflect"] }
bevy-ts-material = { path = "../../crates/bevy-ts-material" }
serde_json = "1"

# As the engine builds Bevy (the workspace's patch).
[patch.crates-io]
bevy_render = { path = "../../vendor/bevy_render" }

[profile.release]
debug = false
